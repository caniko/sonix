# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches:
      - "trunk"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.installable }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - installable: ".#packages.x86_64-linux.goxlr-systemd-vm"
            system: "x86_64-linux"
            runner: "ubuntu-24.04"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Verify native Nix runner
        env:
          EXPECTED_NIX_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "$machine" in
            arm64) machine=aarch64 ;;
            amd64) machine=x86_64 ;;
            i386|i486|i586) machine=i686 ;;
            ppc) machine=powerpc ;;
            ppcle) machine=powerpcle ;;
            ppc64) machine=powerpc64 ;;
            ppc64le) machine=powerpc64le ;;
          esac
          kernel="$(uname -s)"
          case "$kernel" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            FreeBSD) os=freebsd ;;
            *) echo "Unsupported native Nix runner kernel: $kernel" >&2; exit 1 ;;
          esac
          actual_system="$machine-$os"
          if [ "$actual_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got hardware $actual_system" >&2
            exit 1
          fi
          nix_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if [ "$nix_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got configured Nix system $nix_system" >&2
            exit 1
          fi
          printf 'Verified native hardware %s and Nix system %s\n' "$actual_system" "$nix_system"
      - name: Enable hosted KVM
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --print-build-logs --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
