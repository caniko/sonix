[package]
name = "sonix"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/sonix"
description = "Generic PipeWire echo/noise processing with GoXLR routing"
readme = "README.md"
documentation = "https://docs.rs/sonix"
keywords = ["audio", "pipewire", "goxlr"]
categories = ["multimedia::audio"]
include = ["src/**", "crates/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE*", "config.example.pkl", "schemas/**", "Cargo.lock"]

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = ["crates/nexus-audio-processing"]

[[bin]]
name = "goxlr-config"
path = "src/bin/goxlr-config.rs"

[[bin]]
name = "sonix"
path = "src/bin/sonix.rs"

[[bin]]
name = "goxlr-nexus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
nexus-audio-processing = { path = "crates/nexus-audio-processing", version = "0.1.0", features = ["pipewire-runtime"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
zeroize = "1.8"
pklr = { version = "1.2.0", default-features = false, features = ["native-io"] }
tokio = { version = "1.0", default-features = false, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "signal",
  "time",
] }
tungstenite = "0.30"

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }
