[package]
name = "goxlr-nexus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/goxlr-nexus"
description = "GoXLR, JDS Labs DAC, PipeWire, and OBS audio orchestrator"

[[bin]]
name = "goxlr-config"
path = "src/bin/goxlr-config.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
tungstenite = "0.27"
