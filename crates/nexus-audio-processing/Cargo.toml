[package]
name = "nexus-audio-processing"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/sonix"
documentation = "https://docs.rs/nexus-audio-processing"
description = "Portable Sonora noise suppression and echo cancellation with an optional PipeWire runtime"
readme = "README.md"
keywords = ["audio", "pipewire", "echo-cancellation", "noise-suppression", "webrtc"]
categories = ["multimedia::audio"]
include = [
  "src/**",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-*",
  "schemas/**",
]

[features]
default = []
pipewire-runtime = ["dep:pipewire", "dep:crossbeam-queue"]

[dependencies]
crossbeam-queue = { version = "0.3", optional = true }
pipewire = { version = "0.10", optional = true }
smallvec = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = "0.8.17"
sonora = "0.1.0"
thiserror = "2.0"
tracing = "0.1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
allocation-counter = "0.8.1"
divan = "0.1.21"
tempfile = "3.23"

[[bench]]
name = "control_codec"
path = "src/control_codec_bench.rs"
harness = false
