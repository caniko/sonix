user = "can"
jds-sink = "alsa_output.usb-Yoyodyne_Consulting_JDS_Labs_Element_DAC-01.analog-stereo"
fallback-sink = "alsa_output.usb-Yoyodyne_Consulting_JDS_Labs_Element_DAC-01.analog-stereo"
thinkpad-sink = "alsa_output.usb-Lenovo_ThinkPad_Thunderbolt_4_Dock_USB_Audio_000000000000-00.analog-stereo"
output-sinks = [
  "alsa_output.usb-Yoyodyne_Consulting_JDS_Labs_Element_DAC-01.analog-stereo",
  "alsa_output.usb-Lenovo_ThinkPad_Thunderbolt_4_Dock_USB_Audio_000000000000-00.analog-stereo",
]
goxlr-serial = "S200805412CQK"

[profile]
default-sink = "alsa_output.usb-TC-Helicon_GoXLR-00.HiFi__Speaker__sink"
default-source = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Headset__source"
monitor-source = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Line4__source"

[processing]
# The processor is a separate user service. Both stages are fail-open and off
# by default; use `goxlr-nexus processing noise on` or `echo on` to enable one.
enable = true
source-name = "goxlr_nexus.processed_mic"
source-description = "GoXLR Nexus processed microphone"
noise-suppression = false
echo-cancellation = false
noise-level = "high"
# echo-delay = { mode = "fixed", milliseconds = 80 }

[obs]
enable = true
host = "127.0.0.1"
port = 4455

[[obs.sources]]
name = "GoXLR Mic"
device-id = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Headset__source"

[[obs.sources]]
name = "GoXLR Stream Mix"
device-id = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Line4__source"

[[obs.sources]]
name = "GoXLR Sampler"
device-id = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Line5__source"

[[obs.sources]]
name = "GoXLR Desktop Mix"
device-id = "alsa_input.usb-TC-Helicon_GoXLR-00.HiFi__Line4__source"
